$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

# Основные бинды Hyprland
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# Автозапуск приложений и инициализация ALSA
exec-once = waybar
exec-once = amixer -c Generic_1 sset "Auto-Mute Mode" Disabled
exec-once = amixer -c Generic_1 sset Headphone 100% unmute

# ASUS VG27WQ (1440p @ 165.01Hz)
monitor = DP-3, 2560x1440@165.01, 0x0, 1

# Samsung F27G3xTF (1080p @ 144Hz)
monitor = HDMI-A-1, 1920x1080@144, 2560x0, 1
